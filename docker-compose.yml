services:
  postgres:
    image: postgres:16-alpine
    container_name: cove-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cove
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cc3721b
    ports:
      - "5434:5432"
    volumes:
      - cove-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cove"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cove-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cove-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: cove-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cove-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  cove-postgres:
  cove-redis:
  cove-minio:
