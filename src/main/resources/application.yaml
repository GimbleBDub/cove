server:
  port: ${SERVER_PORT:8099}

spring:
  application:
    name: cove
  servlet:
    multipart:
      # Phone photos are routinely 3-8MB and walkthrough videos far larger;
      # Spring's 1MB default rejected nearly every real upload.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:210MB}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:cove}
    username: ${DB_USERNAME:cms}
    password: ${DB_PASSWORD:cc3721b}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  mail:
    host: mail.gimble.co.bw
    port: 465
    username: support@gimble.co.bw
    name: Cove
    password: 'Kp)w{Y,Oq^-Z,D%2'
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          starttls:
            enable: false
        from: support@gimble.co.bw
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jackson.JacksonAutoConfiguration
app:
  jwt:
    secret: ${JWT_SECRET:dev_J6vN9pQ2xR8LmW4zTcY7KaE5HsU1FnBdP3ZwQ9RgXmV2cLfN8yAhS6kJe4Ut}
    access-ttl-seconds: 900
  base-url: http://localhost:64045
  mail:
    from: support@gimble.co.bw
  frontend-url: ${FRONTEND_URL:http://localhost:64045}
  public-api-url: ${PUBLIC_API_URL:http://localhost:8099}
  password-reset:
    frontend-url: ${FRONTEND_URL:http://localhost:64045}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    kyc-bucket: ${STORAGE_KYC_BUCKET:cove-kyc}
    profile-bucket: ${STORAGE_PROFILE_BUCKET:cove-profile-photos}
    organisations-bucket: ${STORAGE_ORGANISATIONS_BUCKET:cove-organisations}
    property-media-bucket: ${STORAGE_PROPERTY_MEDIA_BUCKET:cove-property-media}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000}
    presigned-url-ttl-minutes: ${STORAGE_PRESIGNED_TTL_MINUTES:15}
