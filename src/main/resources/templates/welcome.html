<!-- templates/welcome.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Welcome to Cove</title>
    <style>
        body { margin:0; padding:0; background:#FFFFFF; font-family:'Helvetica Neue',Arial,sans-serif; }
        .canvas { max-width:600px; margin:32px auto; }
        .card { border:1px solid #E5E7EB; border-radius:16px; overflow:visible; }
        .topstripe { height:4px; background:#059669; border-radius:16px 16px 0 0; }
        .header { background:#000000; padding:28px 32px; display:flex; align-items:center; justify-content:center; }
        .logomark { display:inline-block; width:32px; height:32px; background:#059669; border-radius:8px; text-align:center; line-height:32px; color:#FFFFFF; font-weight:800; font-size:16px; vertical-align:middle; margin-right:10px; }
        .wordmark { display:inline-block; vertical-align:middle; color:#FFFFFF; font-size:12px; letter-spacing:3px; font-weight:600; text-transform:uppercase; }
        .badge-row { text-align:center; margin-top:-30px; }
        .badge { display:inline-block; width:60px; height:60px; background:#059669; border-radius:50%; border:5px solid #FFFFFF; box-shadow:0 2px 6px rgba(0,0,0,.12); line-height:60px; }
        .content { padding:16px 40px 40px; text-align:center; }
        h1 { font-size:24px; color:#111827; margin:8px 0 12px; font-weight:800; }
        p.lead { font-size:15px; line-height:1.7; color:#4B5563; margin:0 auto 28px; max-width:400px; }
        .footer { background:#000000; padding:26px 32px; text-align:center; border-radius:0 0 16px 16px; }
        .footer p { margin:0; font-size:11px; color:#9CA3AF; letter-spacing:.3px; }
        .footer .dot { color:#A7F3D0; margin:0 8px; }
    </style>
</head>
<body>
<div class="canvas">
    <div class="card">
        <div class="topstripe"></div>
        <div class="header">
            <span class="logomark">C</span>
            <span class="wordmark">Cove</span>
        </div>
        <div class="badge-row">
            <span class="badge">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3l2.6 5.4 6 .8-4.3 4.2 1 6-5.3-2.8-5.3 2.8 1-6-4.3-4.2 6-.8L12 3z" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
                </svg>
            </span>
        </div>
        <div class="content">
            <h1>You're verified</span></h1>
            <p class="lead">Your account is active. You can now log in, complete your profile, and start browsing or listing on Cove.</p>
        </div>
        <div class="footer">
            <p><span th:text="${year}"></span> Cove <span class="dot">&bull;</span> Gaborone, Botswana</p>
        </div>
    </div>
</div>
</body>
</html>
